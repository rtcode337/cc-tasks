# 本番用。イメージは GitHub Actions(.github/workflows/docker-publish.yml)が
# main への push でビルドし GHCR へ公開する。本番ではビルドせず pull するだけ:
#
#   docker compose pull && docker compose up -d
#
# TLS 終端と外部公開はこの手前のリバースプロキシの責務 (仕様書 §3, §6.3)。
# ローカルでイメージをビルドして動かしたいときは compose.build.yaml を使う。
services:
  cctasks:
    # 障害時は :latest ではなく :sha-xxxxxxx を指定すれば任意の時点に戻せる。
    # CCTASKS_IMAGE で上書き可(既定は GHCR の latest)。
    image: ${CCTASKS_IMAGE:-ghcr.io/rtcode337/cc-tasks:latest}
    container_name: cc-tasks
    restart: unless-stopped
    ports:
      # プロキシからのみ届けばよいのでループバックに閉じる
      - "127.0.0.1:7000:7000"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID を .env に設定してください}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET を .env に設定してください}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:?ログインを許可するメールアドレスを .env に設定してください}
      MCP_API_KEY: ${MCP_API_KEY:?MCP 用 API キーを .env に設定してください}
      # 任意。サーバーの OAuth は未設定でもリクエスト(X-Forwarded-Proto/Host)から
      # リダイレクトを自動導出する。プロキシがそれらを送らない/固定したい場合のみ設定。
      # ※ .mcp.json の接続先 ${PUBLIC_BASE_URL}/mcp はクライアント側のシェル環境変数で
      #    展開されるもので、サーバーのこの値とは別物(必須ではない)。
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DB_PATH: /data/cctasks.db
      TZ: Asia/Tokyo
    volumes:
      - cctasks-data:/data
    # 非力なサーバー前提。JVM 側は MaxRAMPercentage でこの上限に追従する
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cctasks-data:
