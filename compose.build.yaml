# ローカルでイメージをビルドして本番同等に動かす用。
#
#   docker compose -f compose.build.yaml up -d --build
#
# 本番は compose.yaml(GHCR から pull)を使う。設定は compose.yaml と揃えてあり、
# 違いは image を pull せず手元でビルドする点だけ。
services:
  # data/ の所有者合わせ。狙いは compose.yaml のコメント参照。
  # 本体と同じビルド・同じタグなので、ビルドは 1 回で済む(2 つ目はキャッシュに当たる)
  cctasks-init:
    build: .
    image: ghcr.io/rtcode337/cc-tasks:local
    container_name: cc-tasks-init
    user: root
    volumes:
      - ./data:/data
    entrypoint: ["sh", "-c", "chown -R ${CCTASKS_UID:-1000}:${CCTASKS_GID:-1000} /data"]
    restart: "no"

  cctasks:
    depends_on:
      cctasks-init:
        condition: service_completed_successfully
    build: .
    image: ghcr.io/rtcode337/cc-tasks:local
    container_name: cc-tasks
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID を .env に設定してください}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET を .env に設定してください}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:?ログインを許可するメールアドレスを .env に設定してください}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # PUBLIC_BASE_URL を使わず Host/X-Forwarded-Host から導出させる場合に必須。
      # ここに載せたホストでしか redirect_uri を組み立てない(ヘッダは詐称できるため)
      ALLOWED_REDIRECT_HOSTS: ${ALLOWED_REDIRECT_HOSTS:-}
      DB_PATH: /data/cctasks.db
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ./data:/data
    user: "${CCTASKS_UID:-1000}:${CCTASKS_GID:-1000}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
