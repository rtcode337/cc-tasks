# 依存更新の PR を Dependabot に作らせる設定。
# 週 1 回にまとめ、パッチ・マイナーは 1 本の PR にグループ化して数を抑える
# (メジャーバージョンアップだけ個別の PR になるので、内容を見て判断する)。
# 更新 PR は ci ワークフロー(テスト + 型チェック)が通ることを確認してからマージする。
version: 2
updates:
  # フロントエンドの npm 依存
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7(ネイティブ移植版)は package の exports から `./lib/tsc` を外しており、
      # それを require.resolve する vue-tsc が起動できない
      # (`ERR_PACKAGE_PATH_NOT_EXPORTED`。vue-tsc 3.3.9 時点でも未対応。peer は
      # `typescript: >=5.0.0` と広いので、npm install では気づけず CI で落ちる)。
      # **上げられない PR が出続けても判断は変わらない**ので、メジャーだけ止めておく。
      # vue-tsc が対応したらこの ignore を外す(5.x 系のマイナー・パッチは今までどおり来る)。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # バックエンドの Gradle 依存
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]

  # Dockerfile のベースイメージ(node / temurin)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # ワークフローで使う actions のバージョン
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
