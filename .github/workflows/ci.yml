# PR と main への push でテストを回す。
# docker-publish はビルドするだけでテストを実行しないため、依存更新
# (Dependabot)や手直しの PR はここが通ってからマージする。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Gradle 本体と依存のキャッシュ
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Dockerfile の frontend ステージ(node:26-alpine)と合わせる
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # build は vue-tsc の型チェック込み(package.json 参照)
      - run: npm run build

  # Dependabot の PR のうち、破壊的でない更新(patch / minor)を自動でマージする。
  #
  # needs が唯一のゲート —— ブランチ保護は掛けていない運用なので、
  # 「CI が通ってからマージする」をジョブの依存関係で表している。
  # major は自動で入れない(壊れ方が読めないので人が見る)。
  auto-merge:
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # マージ後にイメージのビルドを起こすために要る(下の理由を参照)
      actions: write
    steps:
      - name: 更新の種類を読む
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: patch / minor ならマージする
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN で作った push は workflow を起こさないので、このままだと
      # 依存が main に入ってもイメージが作り直されない。workflow_dispatch は
      # GITHUB_TOKEN でも発火する例外なので、明示的に起こす
      - name: イメージのビルドを起こす
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh workflow run docker-publish.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
