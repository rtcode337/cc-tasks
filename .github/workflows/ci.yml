# PR と main への push でテストを回す。
# docker-publish はビルドするだけでテストを実行しないため、依存更新
# (Dependabot)や手直しの PR はここが通ってからマージする。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 本体と依存のキャッシュ
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # build は vue-tsc の型チェック込み(package.json 参照)
      - run: npm run build
